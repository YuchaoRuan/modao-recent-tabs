<!DOCTYPE html>
<!--
  模拟墨刀企业版「设计文件页」——QA 独立边界验证夹具（由 QA 严过关编写，不复用工程师夹具）。

  与 mock-modao-design-virtual.html 的差异（为覆盖 8 个边界场景而加强）：
    1. 画布列表 200 页（更长），使 revealCanvasEl 的滚动扫描需要多次 attempt
       （约 300~500ms），从而让「点 A 后立刻点 B」的竞态窗口可被稳定观测。
    2. 提供 __mock.remove(cid)：**真正删除**一个画布（从数据源移除并重渲染），
       用于验证「画布确实已删除」场景下的清理路径。
    3. 提供 __mock.setForm('div' | 'li')：把左侧行在 div.rn-list-item 与
       li.rn-content-item 两种形态间切换，用于验证选择器扩形是否真的生效。
    4. 暴露 __mock.domIds() / inDom() / getClicks() / setActive() / scrollToCid()。
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .app-shell { position: absolute; top: 0; left: 0; right: 0; bottom: 0; overflow: hidden; }
    .app-header {
      position: relative; top: 0; left: 0; right: 0; height: 48px;
      background: #fff; border-bottom: 1px solid #e5e7eb;
      display: flex; align-items: center; padding: 0 16px; z-index: 100;
    }
    .app-header .logo { font-weight: 700; color: #2d7ff9; }
    .rn-sidebar {
      position: absolute; top: 48px; left: 0; width: 220px; bottom: 0;
      background: #f7f8fa; border-right: 1px solid #e5e7eb;
      padding: 8px; display: flex; flex-direction: column;
    }
    /* 虚拟滚动视口：只有视口内的行会真正渲染到 DOM */
    .rn-virtual { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; margin: 0; padding: 0; list-style: none; }
    .rn-list-item, .rn-content-item {
      display: block; height: 32px; line-height: 16px; padding: 8px 10px; border-radius: 6px;
      margin-bottom: 4px; cursor: pointer; font-size: 13px; color: #1f2329;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .rn-list-item:hover, .rn-content-item:hover { background: #eef3ff; }
    .rn-list-item.is-active, .rn-content-item.is-active { background: #eef3ff; color: #2d7ff9; font-weight: 600; }
    .rn-list-item.folder, .rn-content-item.folder { color: #646a73; font-style: italic; }
    .rn-canvas { position: absolute; top: 48px; left: 220px; right: 220px; bottom: 0; padding: 24px; }
    .rn-right-panel {
      position: absolute; top: 48px; right: 0; width: 220px; bottom: 0;
      background: #f7f8fa; border-left: 1px solid #e5e7eb; padding: 8px; overflow: auto;
    }
    .canvas-title { font-size: 18px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="app-header styles__StyledTopBar-sc-121m7wg-0 jBNgew" role="banner">
      <span class="logo">墨刀 · 内网（QA 边界夹具 · 200 页虚拟滚动）</span>
    </div>

    <aside class="rn-sidebar">
      <div class="rn-virtual" id="rn-virtual"></div>
    </aside>

    <main class="rn-canvas">
      <div class="canvas-title">页面 1</div>
      <div>画布编辑区（模拟）</div>
    </main>

    <aside class="rn-right-panel">
      <div class="canvas-title">属性面板</div>
      <div>右侧检查器（模拟）</div>
    </aside>
  </div>

  <script>
  (function () {
    "use strict";
    var ROW_H = 36;               // 32px 行高 + 4px 间距
    var PAGES = [];
    for (var i = 1; i <= 200; i++) PAGES.push({ cid: "P" + pad(i), name: "页面 " + i });
    function pad(i) { return i < 10 ? "00" + i : (i < 100 ? "0" + i : String(i)); }

    var ARCH = [
      { cid: "A1", name: "归档-旧首页" },
      { cid: "A2", name: "归档-旧订单" },
      { cid: "A3", name: "归档-旧登录" }
    ];

    var state = { active: "P001", archOpen: false, clicks: {}, form: "div", deleted: {} };
    var vp = document.getElementById("rn-virtual");
    var titleEl = document.querySelector(".rn-canvas .canvas-title");

    function rows() {
      var r = [{ kind: "folder", cid: "FARCH", name: "归档" + (state.archOpen ? "（展开）" : "（折叠）") }];
      if (state.archOpen) r = r.concat(ARCH);
      return r.concat(PAGES);
    }

    // 虚拟渲染：只把 [first, last] 区间的行真正挂到 DOM
    function render() {
      var all = rows();
      var scrollTop = vp.scrollTop;
      var vh = vp.clientHeight || 600;
      var first = Math.max(0, Math.floor(scrollTop / ROW_H) - 1);
      var last = Math.min(all.length - 1, first + Math.ceil(vh / ROW_H) + 2);
      var html = "";
      if (first > 0) html += '<div style="height:' + (first * ROW_H) + 'px"></div>';
      for (var i = first; i <= last; i++) {
        var it = all[i];
        var base = state.form === "li" ? "rn-content-item" : "rn-list-item";
        var tag = state.form === "li" ? "li" : "div";
        var cls = base + (it.kind === "folder" ? " folder" : "") +
                  (it.cid === state.active ? " is-active" : "");
        html += '<' + tag + ' class="' + cls + '" data-cid="' + it.cid + '">' + it.name + "</" + tag + ">";
      }
      var tail = all.length - 1 - last;
      if (tail > 0) html += '<div style="height:' + (tail * ROW_H) + 'px"></div>';
      vp.innerHTML = html;
    }

    vp.addEventListener("scroll", function () { render(); });

    vp.addEventListener("click", function (e) {
      var t = e.target;
      if (!t || !t.closest) return;
      var item = t.closest("[data-cid]");
      if (!item) return;
      var cid = item.getAttribute("data-cid");
      state.clicks[cid] = (state.clicks[cid] || 0) + 1;
      if (item.classList.contains("folder")) {
        state.archOpen = !state.archOpen;
        render();
        return;
      }
      state.active = cid;
      var all = rows();
      for (var i = 0; i < all.length; i++) {
        if (all[i].cid === cid) { titleEl.textContent = all[i].name; break; }
      }
      render();   // 模拟墨刀 SPA 重绘：节点被替换
    });

    function scrollToCid(cid) {
      var all = rows();
      for (var i = 0; i < all.length; i++) {
        if (all[i].cid === cid) { vp.scrollTop = Math.max(0, (i - 2) * ROW_H); return true; }
      }
      return false;
    }

    window.__mock = {
      state: state,
      render: render,
      rows: rows,
      scrollToCid: scrollToCid,
      setActive: function (cid) { state.active = cid; render(); },
      getClicks: function () { return state.clicks; },
      inDom: function (cid) { return !!vp.querySelector('[data-cid="' + cid + '"]'); },
      domIds: function () {
        return Array.prototype.map.call(vp.querySelectorAll("[data-cid]"), function (e) {
          return e.getAttribute("data-cid");
        });
      },
      title: function () { return titleEl.textContent; },
      // 真正删除一个画布：从数据源移除 + 重渲染（模拟用户在墨刀里删掉画布）
      remove: function (cid) {
        var before = PAGES.length;
        PAGES = PAGES.filter(function (p) { return p.cid !== cid; });
        state.deleted[cid] = true;
        render();
        return PAGES.length < before;
      },
      setForm: function (f) { state.form = (f === "li") ? "li" : "div"; render(); }
    };
    render();
  })();
  </script>
</body>
</html>
